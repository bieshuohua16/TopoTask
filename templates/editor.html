<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ diagram.name }} · TopoTash 拓事</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topotash.css') }}">
</head>
<body class="editor-page">
<div class="editor-bar">
  {% if project %}
  <a class="editor-back" href="/projects/{{ project.id }}?tab=diagrams">
    <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回项目
  </a>
  {% else %}
  <a class="editor-back" href="/diagrams">
    <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回拓扑图库
  </a>
  {% endif %}
  <div class="editor-title">
    <span class="editor-project">{% if project %}{{ project.name }}{% else %}未绑定项目{% endif %}</span>
    <i>/</i>
    <b>{{ diagram.name }}</b>
    {% if project %}<span class="stage-pill {{ project.stage }}">{{ project.stage_label }}</span>{% endif %}
  </div>
  <div class="editor-status" id="editorStatus"><i class="dot ok"></i><span>已连接 TopoTash</span></div>
  <button class="btn btn-ghost btn-sm" id="btnExportDiagram" type="button" title="导出可再次导入的画布 JSON">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    导出 JSON
  </button>
  <button class="btn btn-ghost btn-sm editor-danger" id="btnDeleteDiagram" type="button" title="删除这张拓扑图">
    删除
  </button>
  <a class="btn btn-ghost btn-sm" target="_blank" href="/static/apps/topology/index.html?diagram_id={{ diagram.id }}{% if project %}&project_id={{ project.id }}{% endif %}">独立窗口</a>
</div>
<div class="editor-frame">
  <iframe id="visioFrame" title="拓扑图编辑器"
          src="/static/apps/topology/index.html?diagram_id={{ diagram.id }}{% if project %}&project_id={{ project.id }}{% endif %}"></iframe>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<script>
window.TT_EDITOR = {
  project: {% if project %}{{ project|tojson }}{% else %}null{% endif %},
  diagram: {{ diagram|tojson }}
};
</script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
