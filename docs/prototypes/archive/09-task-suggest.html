<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>09 Tab · 改判成任务</title>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div class="desktop" style="width:1280px;height:800px">
  <div class="ghost" style="left:96px;top:96px;width:880px;height:588px">
    <div class="ghost-bar"><i></i><i></i><i></i><span class="gtitle"></span></div>
    <div class="ghost-in">
      <div class="ghost-side"><i style="width:70%"></i><i style="width:52%"></i><i style="width:62%"></i><i style="width:44%"></i></div>
      <div class="ghost-main"><i class="h"></i><i></i><i class="s"></i><i class="t"></i><div class="box"></div></div>
    </div>
  </div>

  <div class="widget">
    <div class="panel">
      <div class="panel-head">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 9.6V6.4M14.2 13.4l2.2 1.8M9.8 13.4l-2.2 1.8"/>
            <circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/>
            <circle cx="12" cy="4.3" r="1.6" fill="#fff" stroke="none"/>
            <circle cx="19" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
            <circle cx="5" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
          </svg>
        </span>
        <div class="panel-title">记一笔进展<span>10:27</span></div>
        <div class="head-actions">
          <span class="manual" style="color:#667085;margin-right:6px">＋ 新建</span>
          <span class="icon-btn on" title="置顶">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a4 4 0 0 0-6 0z"/></svg>
          </span>
          <span class="icon-btn" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </span>
          <span class="icon-btn" title="收起">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </span>
        </div>
      </div>

      <div class="proj-row">
        <span class="pdot"></span>
        <span class="pname">星海银行 私有云 POC</span>
        <span class="stage">POC 验证</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div class="editor">
        <div class="editor-text" style="min-height:44px">明天把方案 V2 发给客户，周五前要反馈<span class="tok tag">#客户</span><span class="caret"></span></div>
      </div>

      <div class="strip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        <div class="st-main"><b>这句更像任务</b> <span class="st-meta">截止 明天 18:00 · 负责人 我</span></div>
        <span class="skey">Tab 建任务</span>
      </div>

      <div class="recent">
        <div class="recent-item"><time>10:12</time><span>环境清单已确认，等客户开测试账号</span></div>
        <div class="recent-item"><time>09:40</time><span>存储方案定 A 厂全闪，3 节点起步</span></div>
      </div>

      <div class="panel-foot">
        <span class="hint"><kbd>Enter</kbd> 记为进展 · <kbd>Esc</kbd> 收起</span>
        <span class="btn-primary">记录</span>
      </div>
    </div>
  </div>

  <div class="caption"><b>09</b><span class="rule"></span>AI 改判 · 一句待办自动变成任务建议，Enter 仍按进展记</div>
</div>
</body>
</html>
