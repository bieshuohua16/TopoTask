<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>05 设置</title>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div class="desktop" style="width:1280px;height:800px">
  <div class="ghost" style="left:96px;top:96px;width:880px;height:588px">
    <div class="ghost-bar"><i></i><i></i><i></i><span class="gtitle"></span></div>
    <div class="ghost-in">
      <div class="ghost-side"><i style="width:70%"></i><i style="width:52%"></i><i style="width:62%"></i><i style="width:44%"></i></div>
      <div class="ghost-main"><i class="h"></i><i></i><i class="s"></i><i class="t"></i><div class="box"></div></div>
    </div>
  </div>
  <div class="widget">
    <div class="pill" style="margin-left:auto">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
          <path d="M12 9.6V6.4M14.2 13.4l2.2 1.8M9.8 13.4l-2.2 1.8"/>
          <circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/>
          <circle cx="12" cy="4.3" r="1.6" fill="#fff" stroke="none"/>
          <circle cx="19" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
          <circle cx="5" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <span class="pdot"></span>
      <span class="pname">私有云 POC</span>
      <span class="sep"></span>
      <span class="pmeta">今日 4 条</span>
      <span class="pill-add">+</span>
    </div>

    <div class="settings" style="margin-top:10px;margin-left:48px">
      <div class="settings-head">
        速记设置
        <span>v0.1 · 本地</span>
      </div>
      <div class="srow"><span class="sl">全局热键</span>
        <span class="sv"><kbd class="key">Ctrl</kbd><kbd class="key">Alt</kbd><kbd class="key">N</kbd><span class="muted">修改</span></span>
      </div>
      <div class="srow"><span class="sl">默认项目</span>
        <span class="sv">星海银行 私有云 POC <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </div>
      <div class="srow"><span class="sl">悬浮位置</span>
        <span class="sv">右上角 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </div>
      <div class="srow"><span class="sl">始终置顶</span><span class="sv"><span class="toggle on"></span></span></div>
      <div class="srow"><span class="sl">开机自启</span><span class="sv"><span class="toggle on"></span></span></div>
      <div class="srow"><span class="sl">失焦自动存草稿</span><span class="sv"><span class="toggle on"></span></span></div>
      <div class="srow" style="border-bottom:none"><span class="sl">连续记录（提交后不收起）</span><span class="sv"><span class="toggle"></span></span></div>
      <div class="settings-foot">
        已写入 TopoTash · 共 128 条
        <span class="btn-primary">完成</span>
      </div>
    </div>
  </div>
  <div class="caption"><b>05</b><span class="rule"></span>设置面板 · 热键 / 位置 / 置顶 / 自启 / 草稿</div>
</div>
</body>
</html>
