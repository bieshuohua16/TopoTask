<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>06 新建项目 · 一行</title>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div class="desktop" style="width:1280px;height:800px">
  <div class="ghost" style="left:96px;top:96px;width:880px;height:588px">
    <div class="ghost-bar"><i></i><i></i><i></i><span class="gtitle"></span></div>
    <div class="ghost-in">
      <div class="ghost-side"><i style="width:70%"></i><i style="width:52%"></i><i style="width:62%"></i><i style="width:44%"></i></div>
      <div class="ghost-main"><i class="h"></i><i></i><i class="s"></i><i class="t"></i><div class="box"></div></div>
    </div>
  </div>

  <div class="widget">
    <div class="panel wide">
      <div class="panel-head">
        <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 9.6V6.4M14.2 13.4l2.2 1.8M9.8 13.4l-2.2 1.8"/>
            <circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/>
            <circle cx="12" cy="4.3" r="1.6" fill="#fff" stroke="none"/>
            <circle cx="19" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
            <circle cx="5" cy="16.5" r="1.6" fill="#fff" stroke="none"/>
          </svg>
        </span>
        <div class="panel-title">新建项目<span class="c-sub">一行搞定</span></div>
        <div class="head-actions">
          <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
        </div>
      </div>

      <div class="c-body" style="padding-top:2px">
        <div class="cmd">
          <span class="cmd-plus">+</span>
          <span>恒达制造 智能工厂网络改造</span>
          <span class="tok at">@恒达制造</span>
          <span class="tok stage">/方案编写</span>
          <span class="caret"></span>
        </div>

        <div class="parsed">
          <span class="parsed-label">识别</span>
          <span class="pchip"><b>客户</b>恒达制造</span>
          <span class="pchip"><b>阶段</b>方案编写</span>
          <span class="pchip"><b>负责人</b>我</span>
        </div>

        <div class="c-note">只有项目名必填；客户、阶段写不写都行，缺的在项目页补。</div>
      </div>

      <div class="panel-foot">
        <span class="hint"><kbd>Enter</kbd> 创建 · <kbd>Esc</kbd> 取消 · <kbd>Tab</kbd> 补全</span>
        <span class="btn-primary">创建项目</span>
      </div>
    </div>
  </div>

  <div class="caption"><b>06</b><span class="rule"></span>新建项目 · 一行：<b>+ 名称 @客户 /阶段</b>，回车即建</div>
</div>
</body>
</html>
