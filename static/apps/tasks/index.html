/**
 * 查找任务（模糊匹配标题）
 * @param {string} keyword - 搜索关键词
 * @returns {object|null} 最佳匹配的任务
 */
function findTaskByKeyword(keyword) {
  if (!keyword) return null;
  const kw = keyword.toLowerCase();
  // 优先精确匹配
  let found = store.tasks.find(t => t.title === keyword);
  if (found) return found;
  // 然后包含匹配
  found = store.tasks.find(t => t.title.toLowerCase().includes(kw));
  if (found) return found;
  // 最后模糊匹配
  found = store.tasks.find(t => t.title.toLowerCase().split(/\s+/).some(w => w.includes(kw)));
  return found || null;
}

/**
 * 执行 AI 函数调用的实际操作
 * @param {string} name - 函数名
 * @param {object} args - 函数参数
 * @returns {string} 操作结果描述
 */
function executeAIFunction(name, args) {
  switch (name) {
    case 'create_task': {
      // 查找或创建项目
      let projId = null;
      if (args.projectName) {
        const proj = store.projects.find(p => p.name.includes(args.projectName) || args.projectName.includes(p.name));
        if (proj) projId = proj.id;
        else {
          // 自动创建新项目
          projId = 'proj_' + uuid();
          store.projects.push({ id: projId, name: args.projectName, color: '#6366f1', createdAt: now() });
        }
      }
      // 确保标签在全局池中
      (args.tags || []).forEach(tag => { if (!store.tags.includes(tag)) store.tags.push(tag); });
      const task = {
        id: uuid(),
        title: args.title,
        description: args.description || '',
        priority: args.priority ?? 2,
        status: args.status || 'todo',
        dueDate: args.dueDate || null,
        recur: ['daily','weekly','monthly','quarterly','yearly'].includes(args.recur) ? args.recur : null,
        recurDay: typeof args.recurDay === 'number' ? args.recurDay : null,
        projectId: projId,
        tags: args.tags || [],
        subtasks: (args.subtasks || []).map(st => ({ id: uuid(), title: st, completed: false })),
        order: store.tasks.length,
        createdAt: now(),
        updatedAt: now()
      };
      // 自动推算 recurDay（如果 AI 没有明确提供）
      if (task.recur && task.recurDay === null) {
        const ref = task.dueDate ? new Date(task.dueDate) : new Date();
        if (task.recur === 'weekly') task.recurDay = ref.getDay();
        else if (task.recur === 'monthly' || task.recur === 'quarterly') task.recurDay = ref.getDate();
      }
      store.tasks.push(task);
      saveStore(); renderAll();
      return `已创建任务「${task.title}」` +
        (task.subtasks.length ? `，含 ${task.subtasks.length} 个子任务` : '');
    }

    case 'update_task': {
      const t = findTaskByKeyword(args.searchTitle);
      if (!t) return `未找到匹配「${args.searchTitle}」的任务`;
      if (args.title) t.title = args.title;
      if (args.description !== undefined) t.description = args.description;
      if (args.priority !== undefined) t.priority = args.priority;
      if (args.status) t.status = args.status;
      if (args.dueDate) t.dueDate = args.dueDate;
      if (args.recur !== undefined) { t.recur = args.recur === 'none' ? null : (['daily','weekly','monthly','quarterly','yearly'].includes(args.recur) ? args.recur : t.recur); if(!t.recur) t.recurDay = null; }
      if (args.recurDay !== undefined) t.recurDay = typeof args.recurDay === 'number' ? args.recurDay : null;
      // 自动推算 recurDay（如果设了 recur 但没给 recurDay）
      if (t.recur && t.recurDay === null && args.recurDay === undefined) {
        const ref = t.dueDate ? new Date(t.dueDate) : new Date();
        if (t.recur === 'weekly') t.recurDay = ref.getDay();
        else if (t.recur === 'monthly' || t.recur === 'quarterly') t.recurDay = ref.getDate();
      }
      if (args.addTags) { args.addTags.forEach(tag => { if (!t.tags.includes(tag)) t.tags.push(tag); if (!store.tags.includes(tag)) store.tags.push(tag); }); }
      if (args.removeTags) { t.tags = t.tags.filter(tg => !args.removeTags.includes(tg)); }
      if (args.addSubtasks) { args.addSubtasks.forEach(st => t.subtasks.push({ id: uuid(), title: st, completed: false })); }
      t.updatedAt = now();
      saveStore(); renderAll();
      return `已更新任务「${t.title}」`;
    }

    case 'delete_task': {
      const t = findTaskByKeyword(args.searchTitle);
      if (!t) return `未找到匹配「${args.searchTitle}」的任务`;
      const title = t.title;
      store.tasks = store.tasks.filter(x => x.id !== t.id);
      if (selectedTaskId === t.id) selectedTaskId = null;
      saveStore(); renderAll();
      return `已删除任务「${title}」`;
    }

    case 'toggle_task': {
      const t = findTaskByKeyword(args.searchTitle);
      if (!t) return `未找到匹配「${args.searchTitle}」的任务`;
      t.status = t.status === 'done' ? 'todo' : 'done';
      t.updatedAt = now();
      saveStore(); renderAll();
      return `已将任务「${t.title}」标记为${t.status === 'done' ? '已完成' : '未完成'}`;
    }

    case 'list_tasks': {
      let result = [...store.tasks];
      if (args.status) result = result.filter(t => t.status === args.status);
      if (args.priority !== undefined) result = result.filter(t => t.priority === args.priority);
      if (args.projectName) {
        const proj = store.projects.find(p => p.name.includes(args.projectName));
        if (proj) result = result.filter(t => t.projectId === proj.id);
      }
      if (args.keyword) {
        const kw = args.keyword.toLowerCase();
        result = result.filter(t => t.title.toLowerCase().includes(kw) || (t.description||'').toLowerCase().includes(kw));
      }
      if (result.length === 0) return '没有找到匹配的任务';
      const statusMap = { todo: '待办', doing: '进行中', done: '已完成' };
      const priMap = { 0: 'P0', 1: 'P1', 2: 'P2', 3: 'P3' };
      return `找到 ${result.length} 个任务：\n` + result.map(t =>
        `- [${statusMap[t.status]}] [${priMap[t.priority]}] ${t.title}${t.dueDate ? ' (截止: ' + new Date(t.dueDate).toLocaleDateString('zh-CN') + ')' : ''}${t.recur ? ' (循环: ' + getRecurDesc(t.recur, t.recurDay) + ')' : ''}`
      ).join('\n');
    }

    case 'breakdown_task': {
      const t = findTaskByKeyword(args.searchTitle);
      if (!t) return `未找到匹配「${args.searchTitle}」的任务`;
      const newSubs = (args.subtasks || []).filter(st => !t.subtasks.some(existing => existing.title === st));
      newSubs.forEach(st => t.subtasks.push({ id: uuid(), title: st, completed: false }));
      t.updatedAt = now();
      saveStore(); renderAll();
      return `已为任务「${t.title}」添加 ${newSubs.length} 个子任务：${newSubs.join('、')}`;
    }

    default:
      return `未知操作：${name}`;
  }
}

/**
 * 构建发送给 AI 的系统提示词
 * 包含当前任务数据摘要和操作指引
 */
function buildSystemPrompt() {
  const projNames = store.projects.map(p => p.name).join('、');
  const tagNames = store.tags.join('、');
  return `你是一个高效的待办事项管理助手。你可以帮助用户管理他们的任务列表。

当前项目分类：${projNames || '无'}
当前可用标签：${tagNames || '无'}

当前所有任务：
${getTasksSummary()}

你可以通过函数调用来操作任务列表：
- create_task: 创建新任务（支持设置循环周期）
- update_task: 更新已有任务（支持修改循环周期）
- delete_task: 删除任务
- toggle_task: 切换任务完成状态
- list_tasks: 查询任务
- breakdown_task: 为任务添加子任务拆解

关于循环任务：
- 当用户提到"每天/每周/每月/每季度/每年"等周期性任务时，使用 recur 参数设置循环类型
- weekly 类型需要设置 recurDay（0=周日, 1=周一, ..., 6=周六），根据用户指定的星期几来设置；如用户未指定则根据截止日期推算
- monthly/quarterly 类型需要设置 recurDay（1-31，表示几号），根据用户指定的日期来设置；如用户未指定则根据截止日期推算
- 循环任务完成后会自动推进截止日期到下一个周期

注意事项：
1. 当用户说"添加/创建任务"时，使用 create_task
2. 当用户说"完成/做完了"某个任务时，使用 toggle_task
3. 当用户要求"拆解/拆分"任务时，使用 breakdown_task 生成合理的子任务步骤
4. 当用户问"有哪些任务/查看任务"时，使用 list_tasks
5. 操作完成后，用简洁友好的中文告诉用户结果
6. 如果用户请求任务规划建议，分析当前任务的优先级、截止日期等给出建议
7. 如果用户要求总结，统计已完成/未完成/过期任务并给出总结
8. 当前时间：${new Date().toLocaleString('zh-CN')}
9. 回复请用中文`;
}

/**
 * 发送消息给 AI 并处理响应
 * 支持多轮对话和函数调用循环
 */
async function aiSend() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const cfg = getAIConfig();
  if (!cfg) { showSettings('ai'); toast('请先配置 AI API'); return; }

  // 添加用户消息到历史
  store.aiChatHistory.push({ role: 'user', content: text });
  renderAIMessages();
  showAITyping(true);

  try {
    await processAIChat(cfg);
  } catch (err) {
    store.aiChatHistory.push({ role: 'assistant', content: `出错了：${err.message}`, isError: true });
    renderAIMessages();
  } finally {
    showAITyping(false);
    saveStore(); // 持久化聊天历史
  }
}

/**
 * 处理 AI 对话循环（支持多轮函数调用）
 * 最多执行 5 轮函数调用，防止无限循环
 */
async function processAIChat(cfg) {
  const maxRounds = 5;
  for (let round = 0; round < maxRounds; round++) {
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...store.aiChatHistory.filter(m => {
        // 只保留 API 合法的 role，过滤掉 fn（UI 显示用）和错误消息
        if(m.isError && m.role !== 'assistant') return false;
        if(m.role === 'fn') return false;
        return true;
      })
    ];

    const res = await fetch(`${cfg.apiBase}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${cfg.apiKey}`
      },
      body: JSON.stringify({
        model: cfg.model,
        messages,
        tools: getAITools(),
        temperature: cfg.temperature || 0.7
      })
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`API 错误 (${res.status}): ${errText.slice(0, 200)}`);
    }

    const data = await res.json();
    const choice = data.choices?.[0];
    if (!choice) throw new Error('API 返回为空');

    const msg = choice.message;

    // 处理函数调用
    if (msg.tool_calls && msg.tool_calls.length > 0) {
      // 将 AI 的消息（含 tool_calls）加入历史
      store.aiChatHistory.push({ role: 'assistant', content: msg.content || '', tool_calls: msg.tool_calls });

      // 执行每个函数调用
      const fnResults = [];
      for (const tc of msg.tool_calls) {
        const fnName = tc.function.name;
        let fnArgs = {};
        try { fnArgs = JSON.parse(tc.function.arguments); } catch {}

        // 在聊天中显示操作
        const fnDisplay = formatFnCall(fnName, fnArgs);
        store.aiChatHistory.push({ role: 'fn', content: fnDisplay });
        renderAIMessages();

        const result = executeAIFunction(fnName, fnArgs);
        fnResults.push({ tool_call_id: tc.id, role: 'tool', content: result });
      }

      // 将函数结果加入历史
      fnResults.forEach(r => store.aiChatHistory.push(r));
      // 继续循环让 AI 基于函数结果生成回复
      continue;
    }

    // 普通文本回复
    if (msg.content) {
      store.aiChatHistory.push({ role: 'assistant', content: msg.content });
      renderAIMessages();
    }
    break; // 没有函数调用，结束循环
  }
}

/**
 * 格式化函数调用为可读文本
 */
function formatFnCall(name, args) {
  const nameMap = {
    create_task: '创建任务',
    update_task: '更新任务',
    delete_task: '删除任务',
    toggle_task: '切换完成状态',
    list_tasks: '查询任务',
    breakdown_task: '拆解子任务'
  };
  const label = nameMap[name] || name;
  const details = [];
  if (args.title) details.push(`标题: ${args.title}`);
  if (args.searchTitle) details.push(`查找: ${args.searchTitle}`);
  if (args.priority !== undefined) details.push(`优先级: P${args.priority}`);
  if (args.status) details.push(`状态: ${{'todo':'待办','doing':'进行中','done':'已完成'}[args.status]}`);
  if (args.subtasks) details.push(`子任务: ${args.subtasks.join(', ')}`);
  return `🔧 ${label}${details.length ? ' — ' + details.join(' | ') : ''}`;
}

/** 渲染 AI 聊天消息列表 */
function renderAIMessages() {
  const container = document.getElementById('aiMsgs');
  const empty = document.getElementById('aiEmpty');
  if (empty) empty.style.display = store.aiChatHistory.length ? 'none' : 'flex';

  // 清除旧消息（保留 empty 提示和 typing）
  const typing = document.getElementById('aiTyping');
  container.innerHTML = '';
  if (empty) container.appendChild(empty);

  store.aiChatHistory.forEach(msg => {
    if (msg.role === 'tool') return; // 不显示原始工具返回
    if (msg.role === 'assistant' && msg.tool_calls && !msg.content) return; // 跳过纯 tool_calls 消息

    const div = document.createElement('div');
    if (msg.role === 'fn') {
      div.className = 'ai-msg fn-call';
      div.innerHTML = `<span class="fn-name">${escHtml(msg.content)}</span>`;
    } else if (msg.role === 'user') {
      div.className = 'ai-msg user';
      div.textContent = msg.content;
    } else if (msg.role === 'assistant') {
      div.className = 'ai-msg assistant';
      div.innerHTML = formatAIResponse(msg.content);
    }
    container.appendChild(div);
  });

  if (typing) container.appendChild(typing);
  // 滚动到底部
  container.scrollTop = container.scrollHeight;
}

/**
 * 增强版 Markdown 格式化 AI 回复
 * 支持：表格、标题(h2-h4)、水平线、粗体/斜体、行内代码、无序/有序列表、引用块
 */
function formatAIResponse(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const parts = [];
  let buf = '';
  let i = 0;

  function flush() {
    if (buf) { parts.push(buf); buf = ''; }
  }
  function add(html) { flush(); parts.push(html); }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // === 表格 ===
    if (trimmed.includes('|') && i + 1 < lines.length &&
        /^\|?\s*[-:]+[-| :]*$/.test(lines[i + 1].trim())) {
      let t = '<table><thead><tr>';
      parseTableRow(trimmed).forEach(c => { t += '<th>' + fmtInline(escHtml(c)) + '</th>'; });
      t += '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().includes('|')) {
        t += '<tr>';
        parseTableRow(lines[i].trim()).forEach(c => { t += '<td>' + fmtInline(escHtml(c)) + '</td>'; });
        t += '</tr>';
        i++;
      }
      t += '</tbody></table>';
      add(t);
      continue;
    }

    // === 水平线 ===
    if (/^[-*_]{3,}\s*$/.test(trimmed)) {
      add('<hr>');
      i++;
      continue;
    }

    // === 标题 ===
    if (/^####\s+(.+)$/.test(trimmed)) {
      add('<h4>' + fmtInline(escHtml(trimmed.slice(trimmed.indexOf(' ') + 1))) + '</h4>');
      i++;
      continue;
    }
    if (/^###\s+(.+)$/.test(trimmed)) {
      add('<h3>' + fmtInline(escHtml(trimmed.slice(trimmed.indexOf(' ') + 1))) + '</h3>');
      i++;
      continue;
    }
    if (/^##\s+(.+)$/.test(trimmed)) {
      add('<h2>' + fmtInline(escHtml(trimmed.slice(trimmed.indexOf(' ') + 1))) + '</h2>');
      i++;
      continue;
    }

    // === 引用块 ===
    if (/^>\s*/.test(trimmed)) {
      const qLines = [trimmed.replace(/^>\s*/, '')];
      i++;
      while (i < lines.length && /^>\s*/.test(lines[i].trim())) {
        qLines.push(lines[i].trim().replace(/^>\s*/, ''));
        i++;
      }
      add('<blockquote>' + qLines.map(l => fmtInline(escHtml(l))).join('<br>') + '</blockquote>');
      continue;
    }

    // === 有序列表 ===
    if (/^\d+\.\s+(.+)$/.test(trimmed)) {
      let h = '<ol>';
      while (i < lines.length && /^\d+\.\s+(.+)$/.test(lines[i].trim())) {
        h += '<li>' + fmtInline(escHtml(lines[i].trim().match(/^\d+\.\s+(.+)$/)[1])) + '</li>';
        i++;
      }
      h += '</ol>';
      add(h);
      continue;
    }

    // === 无序列表 ===
    if (/^[-*]\s+(.+)$/.test(trimmed)) {
      let h = '<ul>';
      while (i < lines.length && /^[-*]\s+(.+)$/.test(lines[i].trim())) {
        h += '<li>' + fmtInline(escHtml(lines[i].trim().match(/^[-*]\s+(.+)$/)[1])) + '</li>';
        i++;
      }
      h += '</ul>';
      add(h);
      continue;
    }

    // === 空行 ===
    if (trimmed === '') {
      buf += '<br>';
      i++;
      continue;
    }

    // === 普通文本 ===
    buf += fmtInline(escHtml(line)) + '<br>';
    i++;
  }

  flush();

  // 合并输出：移除多余空行，块元素间不加多余 <br>
  let out = '';
  for (let j = 0; j < parts.length; j++) {
    const p = parts[j];
    const isBlock = p.startsWith('<table') || p.startsWith('<h') || p.startsWith('<hr') ||
                    p.startsWith('<blockquote') || p.startsWith('<ol') || p.startsWith('<ul');
    out += p;
    if (j < parts.length - 1 && !isBlock && !parts[j + 1].startsWith('<table') &&
        !parts[j + 1].startsWith('<h') && !parts[j + 1].startsWith('<hr') &&
        !parts[j + 1].startsWith('<blockquote') && !parts[j + 1].startsWith('<ol') &&
        !parts[j + 1].startsWith('<ul')) {
      // 非块元素之间不加额外 <br>（buf 自带）
    }
  }
  // 清理连续多余 <br>
  out = out.replace(/(<br>){3,}/g, '<br><br>');
  return out;
}

/** 解析 Markdown 表格行，返回单元格内容数组 */
function parseTableRow(line) {
  return line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
}

/** 行内格式：代码、粗体、斜体 */
function fmtInline(text) {
  text = text.replace(/`([^`]+)`/g, '<code style="background:var(--code-bg);padding:1px 4px;border-radius:3px;font-size:12px">$1</code>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  return text;
}

function showAITyping(show) {
  const el = document.getElementById('aiTyping');
  if (el) el.classList.toggle('show', show);
}

/** 快捷指令 */
function aiQuick(prompt) {
  const input = document.getElementById('aiInput');
  if (input) { input.value = prompt; input.focus(); }
}

/** 拆解子任务快捷按钮 — 自动使用当前选中的任务 */
function aiQuickBreakdown() {
  let prompt = '帮我拆解一个任务的子任务';
  if (selectedTaskId) {
    const t = store.tasks.find(t => t.id === selectedTaskId);
    if (t) prompt = `把「${t.title}」拆解成详细的子任务`;
  }
  aiQuick(prompt);
}

/* ============================================================================
   ██  键盘快捷键
   / → 聚焦搜索框
   n → 聚焦快速添加
   a → 打开/关闭 AI 面板
   Esc → 关闭详情面板、AI 面板和弹窗
   ============================================================================ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='/'){e.preventDefault();document.getElementById('searchInput').focus()}
  if(e.key==='Escape'){closeDetail();closeModal();const aiP=document.getElementById('aiPanel');if(aiP)aiP.classList.remove('open');document.getElementById('searchInput').blur()}
  if(e.key==='n'){e.preventDefault();const inp=document.getElementById('qaInput');if(inp)inp.focus()}
  if(e.key==='a'){e.preventDefault();toggleAI()}
});

// AI 输入框快捷键：Enter 发送，Shift+Enter 换行
document.addEventListener('keydown',e=>{
  if(e.target.id==='aiInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend()}
});
